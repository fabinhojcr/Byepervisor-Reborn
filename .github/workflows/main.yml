name: Build PS5 ELF

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm cmake ninja-build make

    - name: Setup PS5 Payload SDK
      run: |
        git clone --recursive https://github.com/PS5DEV/ps5-payload-sdk.git $HOME/ps5-sdk
        cd $HOME/ps5-sdk
        make
        echo "PS5_SDK=$HOME/ps5-sdk" >> $GITHUB_ENV
        echo "PS5_PAYLOAD_SDK=$HOME/ps5-sdk" >> $GITHUB_ENV

    - name: Build project
      run: |
        make PS5_SDK=$HOME/ps5-sdk

    - name: Upload ELF artifact
      uses: actions/upload-artifact@v4
      with:
        name: ps5-elf-payload
        path: |
          *.elf
          build/*.elf
