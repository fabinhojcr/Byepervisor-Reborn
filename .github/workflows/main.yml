name: Build PS5 ELF Payload

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PS5-Payload-Dev SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make git
          git clone --recursive https://github.com/ps5-payload-dev/sdk.pt.git ps5-sdk || git clone --recursive https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          make -C ps5-sdk
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-sdk" >> $GITHUB_ENV
          echo "PS5_SDK=$GITHUB_WORKSPACE/ps5-sdk" >> $GITHUB_ENV

      - name: Build Payload
        run: |
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-payload-elf
          path: |
            *.elf
            bin/*.elf
