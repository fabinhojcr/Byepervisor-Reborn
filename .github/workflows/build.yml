name: Build PS5 Payload

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: https://github.com/ps5-payload-dev/sdk/releases :latest # Ou a imagem Docker oficial do SDK utilizada pelo projeto original

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build payload
        run: |
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-payload-elf
          path: |
            *.elf
            bin/*.elf
